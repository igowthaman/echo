<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1F2228" media="(prefers-color-scheme: dark)">
<title>Offline · Echo</title>
<style>
  :root { --paper: #F8F7F4; --surface: #FFFFFF; --text: #2B2F3A; --muted: #5D6270; --line: #E2DFD8; --wash: #D3E5F0; --ink: #2D6187; --on-ink: #FFFFFF; color-scheme: light; }
  @media (prefers-color-scheme: dark) {
    :root { --paper: #17191E; --surface: #1F2228; --text: #E8E6E1; --muted: #A2A6B1; --line: #30343C; --wash: #1F3445; --ink: #8CC3E6; --on-ink: #17191E; color-scheme: dark; }
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    display: grid; place-items: center; background: var(--paper); color: var(--text);
    font: 16px/1.55 system-ui, -apple-system, "Segoe UI", sans-serif;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  main {
    position: relative; overflow: hidden; width: min(360px, 100%); padding: 32px 28px; text-align: center;
    background: var(--surface); border: 1px solid var(--line);
    border-radius: 24px 16px 26px 18px / 18px 26px 16px 24px;
  }
  main::before {
    content: ""; position: absolute; inset: -40% -30% auto auto; width: 80%; height: 80%;
    background: radial-gradient(closest-side, var(--wash), transparent); filter: blur(12px); pointer-events: none;
  }
  main > * { position: relative; }
  img { width: 72px; height: 72px; border-radius: 18px; }
  h1 { font: 400 1.6rem/1.2 Georgia, "Times New Roman", serif; margin: 16px 0 8px; }
  p { color: var(--muted); margin: 0 0 22px; }
  button {
    font: inherit; font-weight: 600; color: var(--on-ink); background: var(--ink); border: 0; cursor: pointer;
    padding: 11px 22px; border-radius: 12px 10px 13px 9px;
  }
  button:focus-visible { outline: 2px solid var(--ink); outline-offset: 3px; }
</style>
</head>
<body>
  <main>
    <img src="/icons/icon-192.png" alt="">
    <h1>You're offline</h1>
    <p>Echo needs a connection to reach your contacts. Check your Wi-Fi or mobile data, then try again.</p>
    <button type="button" onclick="location.reload()">Try again</button>
  </main>
</body>
</html>
